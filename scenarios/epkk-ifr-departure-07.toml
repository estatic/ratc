# IFR departure EPKK -> EPKT on runway 07 (spec 3.2): the same flight as on runway 25 with the
# easterly wind, on the runway 07 SID; the pilot reads everything back correctly.
airport = "EPKK"
navdata = "xplane"
utc = "14:30"
day = 200
pilot = { callsign = "SPABC", type = "C172" }
weather = { wind_dir_deg = 70, wind_speed_kt = 10, visibility_m = 10000, temp_c = 18, dewpoint_c = 9, qnh_hpa = 1018 }
transponder = { code = 2000, mode = 1 }
track = "path"

[path]
start = { stand = "35" }
runway = "07"
waypoints = [
  { fix = "KK801", alt = 3000, kt = 90 },
  { fix = "KK802", alt = 4500, kt = 95 },
  { lat = 50.33404, lon = 19.6112, alt = 5000, kt = 100 },
  { lat = 50.35329, lon = 19.53895, alt = 5000, kt = 100 },
  { lat = 50.39803, lon = 19.37013, alt = 3000, kt = 100 },
  { lat = 50.42984, lon = 19.24936, alt = 2500, kt = 90 },
]

[[say]]
at = "phase:Parked"
freq = "delivery"
text = "Krakow Delivery, Sierra Papa Alpha Bravo Charlie, Cessna one seven two, stand three five, information Alpha, IFR to Katowice, request clearance"

[[say]]
at = "heard:cleared to"
freq = "delivery"
transponder = { code = 4201 }
text = "Cleared to Katowice, Sudol one Foxtrot departure, climb five thousand feet, squawk four two zero one, Sierra Bravo Charlie"

[[say]]
at = "heard:ground"
freq = "delivery"
text = "Ground one one eight decimal one zero five, Sierra Bravo Charlie"

[[say]]
at = "phase:Parked"
freq = "ground"
text = "Krakow Ground, Sierra Papa Alpha Bravo Charlie, stand three five, information Alpha, request start up"

[[say]]
at = "heard:start-up approved"
freq = "ground"
text = "Start up approved, QNH one zero one eight, Sierra Bravo Charlie"

[[say]]
at = "phase:Parked"
freq = "ground"
text = "Krakow Ground, Sierra Bravo Charlie, information Alpha, request taxi"

[[say]]
at = "heard:taxi to"
freq = "ground"
transponder = { mode = 3 }
text = "Taxi to holding point runway zero seven via Bravo four, Bravo three, Bravo two, Bravo one, Foxtrot, hold short runway zero seven, Sierra Bravo Charlie"

[[say]]
at = "heard:contact kraków tower"
freq = "ground"
text = "Tower one two three decimal two five five, Sierra Bravo Charlie"

[[say]]
at = "heard:cleared for take-off"
freq = "tower"
text = "Runway zero seven, cleared for take-off, Sierra Bravo Charlie"

[[say]]
at = "heard:contact kraków approach"
freq = "tower"
text = "Approach one two one decimal zero seven five, Sierra Bravo Charlie"

[[say]]
t = 600.0
freq = "approach"
text = "Krakow Approach, Sierra Papa Alpha Bravo Charlie, Sudol one Foxtrot departure, passing one thousand five hundred feet, climbing five thousand feet"

[[say]]
at = "heard:direct katowice"
freq = "approach"
text = "Direct Katowice, Sierra Bravo Charlie"

[[say]]
at = "heard:descend"
freq = "approach"
text = "Descend three thousand feet, QNH one zero one eight, Sierra Bravo Charlie"

[[say]]
at = "heard:contact katowice tower"
freq = "approach"
text = "Katowice Tower one two nine decimal two five five, Sierra Bravo Charlie"

[[say]]
t = 2056.0
freq = "tower:EPKT"
text = "Katowice Tower, Sierra Papa Alpha Bravo Charlie, descending three thousand feet, inbound to Katowice"
