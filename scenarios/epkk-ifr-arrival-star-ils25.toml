# IFR arrival from the north-west (spec 3.3): the pilot calls Kraków Information, is sent to
# Kraków Approach, gets the MAPIK 1G arrival with the ILS 25 to expect, flies it to KK502,
# is vectored onto the final, cleared for the ILS, transferred to Tower and lands.
airport = "EPKK"
navdata = "xplane"
utc = "11:00"
day = 200
pilot = { callsign = "SPABC", type = "C172" }
weather = { wind_dir_deg = 250, wind_speed_kt = 8, visibility_m = 10000, temp_c = 15, dewpoint_c = 10, qnh_hpa = 1013 }
transponder = { code = 4203, mode = 3 }
track = "path"

[path]
start = { lat = 50.55436, lon = 18.15257, alt = 5000, hdg = 115 }
# Open loop: the legs fly the STAR and the headings Approach gives (magnetic, `hdg`).
waypoints = [
  { fix = "MAPIK", alt = 5000, kt = 110 },
  { fix = "KK511", alt = 5000, kt = 110 },
  { fix = "ODSOB", alt = 5000, kt = 110 },
  { fix = "KK509", alt = 5000, kt = 110 },
  { fix = "KK508", alt = 5000, kt = 110 },
  { fix = "KK507", alt = 5000, kt = 110 },
  { fix = "KK506", alt = 5000, kt = 110 },
  { fix = "KK504", alt = 5000, kt = 110 },
  { fix = "KK503", alt = 5000, kt = 110 },
  { lat = 50.15635, lon = 20.25943, alt = 5000, kt = 100 },
  { hdg = 255, nm = 3.85, alt = 3000, kt = 100 },
  { hdg = 220, nm = 0.8, alt = 3000, kt = 90 },
  { fix = "KK371", alt = 3000, kt = 90 },
]
land = "25"

[[say]]
t = 5.0
freq = "information"
text = "Krakow Information, Sierra Papa Alpha Bravo Charlie, Cessna one seven two, IFR from Opole to Krakow, five thousand feet, inbound Krakow"

[[say]]
at = "heard:contact kraków approach"
freq = "information"
text = "Approach one two one decimal zero seven five, Sierra Bravo Charlie"

[[say]]
t = 15.0
freq = "approach"
text = "Krakow Approach, Sierra Papa Alpha Bravo Charlie, IFR, five thousand feet, inbound Krakow, information Alpha"

[[say]]
at = "heard:arrival"
freq = "approach"
text = "MAPIK one Golf arrival, maintain five thousand feet, QNH one zero one three, expect ILS approach runway two five, Sierra Bravo Charlie"

[[say]]
at = "heard:heading two five five"
freq = "approach"
text = "Right heading two five five, descend three thousand feet, Sierra Bravo Charlie"

[[say]]
at = "heard:cleared ils"
freq = "approach"
text = "Left heading two two zero, cleared ILS approach runway two five, wilco, Sierra Bravo Charlie"

[[say]]
at = "phase:Final"
freq = "approach"
text = "Sierra Bravo Charlie, established ILS runway two five"

[[say]]
at = "heard:contact kraków tower"
freq = "approach"
text = "Tower one two three decimal two five five, Sierra Bravo Charlie"

[[say]]
at = "phase:Final"
freq = "tower"
text = "Krakow Tower, Sierra Papa Alpha Bravo Charlie, established ILS runway two five"

[[say]]
at = "heard:cleared to land"
freq = "tower"
text = "Runway two five, cleared to land, Sierra Bravo Charlie"

[[say]]
at = "heard:contact kraków ground"
freq = "tower"
text = "Vacating, Ground one one eight decimal one zero five, Sierra Bravo Charlie"

[[say]]
at = "phase:TaxiIn"
freq = "ground"
text = "Krakow Ground, Sierra Papa Alpha Bravo Charlie, runway vacated, request taxi to stand three five"

[[say]]
at = "heard:taxi to stand"
freq = "ground"
text = "Taxi to stand three five via Charlie, Bravo four, Sierra Bravo Charlie"

[[say]]
at = "phase:Parked"
freq = "ground"
text = "Sierra Bravo Charlie, on stand three five"
