# Language detection on: the pilot taxies out in Polish, talks English with Tower and comes
# back to Polish on Ground. English lines tagged `pl` by the recogniser (a short "roger",
# a readback understood the same in English) keep the exchange in English.
airport = "EPKK"
pilot = { callsign = "SPABC", type = "C172" }
weather = { wind_dir_deg = 250, wind_speed_kt = 8, visibility_m = 10000, temp_c = 15, dewpoint_c = 10, qnh_hpa = 1013 }
track = "synthetic-circuit:25"
language = "auto"

[[say]]
at = "phase:Parked"
freq = "ground"
lang = "pl"
text = "Kraków Ground, Sierra Papa Alfa Bravo Charlie, informacja Alfa, proszę o kołowanie do kręgów"

[[say]]
at = "phase:Parked"
freq = "ground"
lang = "pl"
text = "Kołuję do punktu oczekiwania przed pasem dwa pięć drogą Bravo pięć, Bravo sześć, Alfa, oczekuję przed pasem dwa pięć, QNH dziesięć trzynaście, skłok cztery dwa zero jeden, Sierra Bravo Charlie"

[[say]]
at = "phase:HoldingShort"
freq = "ground"
lang = "pl"
text = "Łączność z Kraków Wieża sto dwadzieścia trzy kropka dwa pięć pięć, Sierra Bravo Charlie"

# Back to English with Tower.
[[say]]
at = "phase:HoldingShort"
freq = "tower"
text = "Krakow Tower, Sierra Papa Alpha Bravo Charlie, holding point runway two five, ready for departure"

# English tagged `pl`: understood the same in English, stays English.
[[say]]
at = "phase:HoldingShort"
freq = "tower"
lang = "pl"
text = "Runway two five, cleared for take-off, report downwind, Sierra Bravo Charlie"

[[say]]
at = "phase:Downwind"
freq = "tower"
text = "Sierra Bravo Charlie, downwind, full stop"

# A short "roger" misdetected as Polish: no switch.
[[say]]
at = "phase:Downwind"
freq = "tower"
lang = "pl"
text = "Roger, Sierra Bravo Charlie"

[[say]]
at = "phase:Final"
freq = "tower"
lang = "pl"
text = "Sierra Bravo Charlie, final"

[[say]]
at = "phase:Final"
freq = "tower"
text = "Runway two five, cleared to land, Sierra Bravo Charlie"

[[say]]
at = "phase:Landed"
freq = "tower"
text = "Vacating, contact Krakow Ground one one eight decimal one zero five, Sierra Bravo Charlie"

# Polish again on Ground.
[[say]]
at = "phase:TaxiIn"
freq = "ground"
lang = "pl"
text = "Kraków Ground, Sierra Bravo Charlie, proszę o kołowanie do stanowiska"

[[say]]
at = "phase:TaxiIn"
freq = "ground"
lang = "pl"
text = "Kołuję do stanowiska trzy pięć drogą Charlie, Bravo cztery, Sierra Bravo Charlie"
