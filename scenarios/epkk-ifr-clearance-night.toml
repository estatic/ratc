# Clearance outside Delivery hours (AIP AD 2.20: Delivery 0600-2200 UTC in summer time):
# at 23:00 UTC the call to Delivery goes unanswered; Ground issues the IFR clearance to
# Katowice, then start-up and taxi as usual; Tower calls at the holding point and sends the
# departure to Approach.
airport = "EPKK"
navdata = "xplane"
utc = "23:00"
day = 200
pilot = { callsign = "SPABC", type = "C172" }
weather = { wind_dir_deg = 250, wind_speed_kt = 5, visibility_m = 10000, temp_c = 12, dewpoint_c = 8, qnh_hpa = 1016 }
transponder = { code = 2000, mode = 1 }
track = "path"

[path]
start = { stand = "35" }
runway = "25"
waypoints = [
  { fix = "KK599", alt = 3000, kt = 90 },
]

[[say]]
at = "phase:Parked"
freq = "delivery"
text = "Krakow Delivery, Sierra Papa Alpha Bravo Charlie, stand three five, information Alpha, IFR to Katowice, request clearance"

[[say]]
at = "phase:Parked"
freq = "ground"
text = "Krakow Ground, Sierra Papa Alpha Bravo Charlie, stand three five, information Alpha, IFR to Katowice, request clearance"

[[say]]
at = "heard:cleared to"
freq = "ground"
transponder = { code = 4201 }
text = "Cleared to Katowice, Sudol two Juliett departure, climb five thousand feet, squawk four two zero one, Sierra Bravo Charlie"

[[say]]
at = "phase:Parked"
freq = "ground"
text = "Sierra Bravo Charlie, request start up"

[[say]]
at = "heard:start-up approved"
freq = "ground"
text = "Start up approved, QNH one zero one six, Sierra Bravo Charlie"

[[say]]
at = "phase:Parked"
freq = "ground"
text = "Sierra Bravo Charlie, information Alpha, request taxi"

[[say]]
at = "heard:taxi to"
freq = "ground"
transponder = { mode = 3 }
text = "Taxi to holding point runway two five via Bravo five, Bravo six, Alpha, hold short runway two five, Sierra Bravo Charlie"

[[say]]
at = "heard:contact kraków tower"
freq = "ground"
text = "Tower one two three decimal two five five, Sierra Bravo Charlie"

[[say]]
at = "heard:cleared for take-off"
freq = "tower"
text = "Runway two five, cleared for take-off, Sierra Bravo Charlie"

[[say]]
at = "heard:contact kraków approach"
freq = "tower"
text = "Approach one two one decimal zero seven five, Sierra Bravo Charlie"

[[say]]
t = 300.0
freq = "approach"
text = "Krakow Approach, Sierra Papa Alpha Bravo Charlie, Sudol two Juliett departure, passing one thousand five hundred feet, climbing five thousand feet"
