# Calls from a real flight that went unanswered or were misjudged. The transponder is left on
# standby: Tower asks for mode Charlie, the pilot asks to say again and gets it word for word.
# Taxiing in, "requests" is a request, the pilot asks how to taxi and gets the route again,
# and the readback with the last taxiway "Sierra" in front of the callsign is correct.
airport = "EPKK"
pilot = { callsign = "SPABC", type = "C172" }
weather = { wind_dir_deg = 250, wind_speed_kt = 8, visibility_m = 10000, temp_c = 15, dewpoint_c = 10, qnh_hpa = 1013 }
track = "synthetic-circuit:25"
transponder = { code = 4201, mode = 1 }

[[say]]
at = "phase:Parked"
freq = "ground"
text = "Krakow Ground, Sierra Papa Alpha Bravo Charlie, information Alpha, request taxi for circuits"

[[say]]
at = "phase:Parked"
freq = "ground"
text = "Taxi to holding point runway two five via Bravo five, Bravo six, Alpha, hold short runway two five, QNH one zero one three, squawk four two zero one, Sierra Bravo Charlie"

[[say]]
at = "phase:HoldingShort"
freq = "ground"
text = "Contact Krakow Tower one two three decimal two five five, Sierra Bravo Charlie"

[[say]]
t = 141.0
freq = "tower"
text = "Say again please"

[[say]]
t = 141.0
freq = "tower"
text = "Squawk Charlie, Sierra Bravo Charlie"
transponder = { mode = 2 }

[[say]]
t = 141.0
freq = "tower"
text = "Runway two five, cleared for take-off, report downwind, Sierra Bravo Charlie"

[[say]]
at = "phase:Downwind"
freq = "tower"
text = "Sierra Bravo Charlie, downwind, full stop"

[[say]]
at = "phase:Downwind"
freq = "tower"
text = "Number one, report final, Sierra Bravo Charlie"

[[say]]
at = "phase:Final"
freq = "tower"
text = "Sierra Bravo Charlie, final"

[[say]]
at = "phase:Final"
freq = "tower"
text = "Runway two five, cleared to land, Sierra Bravo Charlie"

[[say]]
at = "phase:Landed"
freq = "tower"
text = "Vacating, contact Krakow Ground one one eight decimal one zero five, Sierra Bravo Charlie"

[[say]]
at = "phase:TaxiIn"
freq = "ground"
text = "Kraków Ground's Sierra Bravo Charlie requests taxi to stand two zero."

[[say]]
at = "phase:TaxiIn"
freq = "ground"
text = "Kraków Ground, could you get me how to taxi to the Sierra Sierra Bravo Charlie"

[[say]]
at = "phase:TaxiIn"
freq = "ground"
text = "Taxi to stand two zero via Charlie, Bravo four, Bravo five, Whiskey one, Sierra Sierra, Bravo Charlie"
