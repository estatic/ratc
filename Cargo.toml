[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.1.0"
authors = ["Ivan Grunev"]
license = "PolyForm-Noncommercial-1.0.0"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
thiserror = "2"
anyhow = "1"
serde_json = "1"
hound = "3"
# GPU backend per platform in crates/atc-voice/Cargo.toml (Vulkan; Metal on macOS).
whisper-rs = "0.16"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "sync", "net"] }
axum = { version = "0.8.9", features = ["ws"] }
futures-util = "0.3.34"
tracing = "0.1.44"
tokio-tungstenite = "0.30"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
cpal = "0.18.2"
gilrs = "0.11.2"
crossterm = "0.29"
