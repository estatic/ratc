[package]
name = "atc-xplane-plugin"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

# X-Plane loads `<plugin>/64/lin.xpl` (Linux) or `win.xpl` (Windows); tools/install-xplane-plugin
# (.sh / .ps1) copies the built `libatc_overlay.so` / `atc_overlay.dll` there.
[lib]
name = "atc_overlay"
crate-type = ["cdylib"]

[dependencies]
atc-proto = { path = "../atc-proto" }
