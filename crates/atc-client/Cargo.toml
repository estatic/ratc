[package]
name = "atc-client"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "atc-client"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
atc-proto = { path = "../atc-proto" }
atc-voice = { path = "../atc-voice" }
cpal = { workspace = true }
crossterm = { workspace = true }
futures-util = { workspace = true }
gilrs = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["time", "io-std", "io-util"] }
tokio-tungstenite = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
atc-core = { path = "../atc-core", features = ["testkit"] }
atc-navdata = { path = "../atc-navdata" }
atc-server = { path = "../atc-server", default-features = false }
atc-voice = { path = "../atc-voice", features = ["fakes"] }
axum = { workspace = true }
