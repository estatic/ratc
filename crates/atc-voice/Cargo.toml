[package]
name = "atc-voice"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[features]
whisper = ["dep:whisper-rs"]
piper = ["dep:serde_json"]
fakes = []

[dependencies]
serde = { workspace = true }
thiserror = { workspace = true }
hound = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
serde_json = { workspace = true, optional = true }

# Whisper's GPU backend: Vulkan, Metal on macOS (no native Vulkan there).
[target.'cfg(not(target_os = "macos"))'.dependencies]
whisper-rs = { workspace = true, optional = true, features = ["vulkan"] }

[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { workspace = true, optional = true, features = ["metal"] }

[dev-dependencies]
atc-phraseology = { path = "../atc-phraseology" }

[[bin]]
name = "voice-bench"
path = "src/bin/voice-bench.rs"
required-features = ["whisper", "piper"]
