icao = "EPKK"
source = "AIP Polska eAIP IFR, AD 2 EPKK: AD 2.17 (transition altitude), AD 2.18 (frequencies). Circuits and preferred runway are NOT in AIP: ICAO standard, user-approved."
airac = "AIRAC AMDT 10-26 (2026-10-01)"
transition_altitude_ft = 6500
# Controller ruling: prevailing westerlies.
preferred_runway = "25"
# AIP VAC AD 2 EPKK 13-1: VAR 6°E 2024 (east positive).
magnetic_variation_deg = 6.0

# AIP AD 2.22 3.3: VFR holding over KILO or ZULU, not higher than 2000 ft AMSL.
vfr_holds = ["KILO", "ZULU"]
vfr_hold_max_ft = 2000
# Same Approach unit: AD 2.18 (126.530; 126.975 also listed, unused) and AD 2 EPKT 2.18 (135.405).
approach_alt_khz = [126530, 135405]
# Approximation of the KRAKOW TMA polygon (ruling): circle, FL095 ceiling.
tma = { radius_nm = 40.0, ceiling_ft = 9500 }
# AIP AD 2.20, UTC hours.
delivery_hours = { summer_utc = [6, 22], winter_utc = [5, 21] }
# Design decision (spec 3.2), not AIP.
ifr = { cruise_ft = 5000 }

# ICAO standard, user-approved -- not published in AIP.
# Left-hand, 1000 ft AGL: field elevation 791 ft + 1000 = 1791 -> 1800 ft AMSL.
[[circuits]]
runway = "07"
side = "Left"
altitude_ft_msl = 1800

